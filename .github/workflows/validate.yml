name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Validate installable skill
        run: python scripts/validate_skill.py
      - name: Run unit and fixture infrastructure tests
        run: python -m unittest discover -s tests -v
      - name: Validate behavior evaluation catalog
        run: python scripts/eval_cases.py validate-cases
      - name: Check Python sources
        run: python -m compileall -q project-evolution-engine/scripts scripts tests evals/oracles
      - name: Exercise read-only collector
        run: python project-evolution-engine/scripts/collect_evidence.py --root . > /tmp/evolution-evidence.json
