name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Validate installable skill
        run: python scripts/validate_skill.py
      - name: Run unit and fixture infrastructure tests
        run: python -m unittest discover -s tests -v
      - name: Validate behavior evaluation catalog
        run: python scripts/eval_cases.py validate-cases
      - name: Check Python sources
        run: python -m compileall -q project-evolution-engine/scripts scripts tests evals/oracles
      - name: Exercise read-only collector
        run: python project-evolution-engine/scripts/collect_evidence.py --root . > /tmp/evolution-evidence.json

  public-pilot-baselines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - name: Install isolated pilot test dependencies
        run: |
          python -m pip install -r evals/real-projects/requirements.lock.txt
          npm ci --prefix evals/real-projects/node --ignore-scripts --no-audit --no-fund
      - name: Verify original behavior and negative acceptance checks
        run: python scripts/real_project_eval.py self-check

  serena-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - name: Install the pinned optional MCP runtime
        run: python -m pip install 'uv==0.12.3' 'serena-agent @ git+https://github.com/oraios/serena.git@813fd98f4fd32e0606cb52281467fc055e45a356'
      - name: Exercise real Python and TypeScript symbol queries and context refresh
        run: python scripts/check_serena_integration.py --serena "$(command -v serena)" --output /tmp/evolution-serena-ci
